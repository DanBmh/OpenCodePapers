# Counterpart of .gitlab-ci.yml: triggers, and calls GitHub's reusable workflows below (no
# 'include:', so they have to live flat in this folder).
#
#   linting.yml        - PRs into the intake branch, or pushes to develop: lint code changes
#   validate_data.yml  - any push or PRs into the intake branch
#   sync_intake.yml    - push to main (mirrored from GitLab): bring the intake branch up to date
#   merge_bot.yml      - every 10 minutes, only upstream repo: merge valid data-only pull requests
#
# Secret BOT_TOKEN: GitHub App token/PAT with Pull requests + Contents: read/write, Checks +
# Metadata: read, allowed to push to the intake branch. GITHUB_TOKEN doesn't work here: its
# pushes/merges don't trigger follow-up workflows.
#
# Push runs use the workflow files of the pushed commit. The jobs that use BOT_TOKEN therefore
# only run in the main repository, and only for main (moved only by the GitLab mirror) or on a
# schedule (always from the default branch).

name: ci

on:
  pull_request:
    branches: [github]
  push:

permissions:
  contents: read

jobs:
  linting:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'github') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/develop')
    uses: ./.github/workflows/linting.yml

  # The name of the check that the pull request gets is '<this job> / <job in the called file>',
  # here 'validate_data / validate'. The merge bot in scheduled.yml has to ask for exactly this
  # name.
  validate_data:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'github') ||
      github.event_name == 'push'
    uses: ./.github/workflows/validate_data.yml

  sync_intake:
    # Only for the real push to main, not for a develop push used to try out CI changes, and
    # not in forks (no BOT_TOKEN there)
    if: |
      github.repository == 'OpenCodePapers/OpenCodePapers' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/sync_intake.yml
    secrets: inherit
    with:
      intake_branch: github
      source_branch: main
