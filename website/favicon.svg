<svg
  xmlns="http://www.w3.org/2000/svg"
  width="128"
  height="128"
  viewBox="0 0 24 24"
  fill="none"
  role="img"
  aria-label="OpenCodePapers"
  shape-rendering="geometricPrecision"
  text-rendering="geometricPrecision">

  <defs>
    <linearGradient id="tg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1017c6"/>
      <stop offset="100%" stop-color="#2ab912"/>
    </linearGradient>
  </defs>

  <g transform="translate(12 12) scale(1.05) translate(-12 -12)">
  
    <!-- Top bracket -->
    <path
      d="M2 6 L12 2 L22 6"
      stroke="#1017c6"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"/>

    <!-- OCP -->
    <text
      x="12.1"
      y="15.8"
      text-anchor="middle"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system"
      font-size="9.7"
      font-weight="900"
      letter-spacing="0.35"
      fill="url(#tg)">
      OCP
    </text>

    <!-- Bottom bracket -->
    <path
      d="M2 18 L12 22 L22 18"
      stroke="#2ab912"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"/>
  </g>

</svg>
