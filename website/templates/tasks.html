<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCodePapers</title>
    <link rel="icon" href="favicon.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!--[basestyle]-->
    <!--[herostyle]-->
    <style>
      .wrap {
        max-width: 1100px;
        margin: 28px auto;
        padding: 0 16px 48px;
      }
      .hero {
        padding: 60px 20px;
      }
      .hero-title {
        font-size: 40px;
        margin: 0 0 12px;
      }
      .hero-sub {
        font-size: 18px;
        color: #e0e7ff;
        margin: 0;
      }
      header.sticky {
        position: sticky;
        top: 0;
        z-index: 50;
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: saturate(1.1) blur(6px);
        border-bottom: 1px solid var(--border);
      }
      header .inner {
        max-width: 1100px;
        margin: 0 auto;
        padding: 10px 16px;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
        grid-template-areas:
          "title badges"
          "search badges";
        gap: 8px 12px;
        align-items: center;
      }
      .header-top {
        grid-area: title;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      h1 {
        font-size: 24px;
        margin: 0;
      }
      .controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
      }
      .btn {
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
        padding: 8px 10px;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
      }
      .btn:hover {
        background: var(--hover);
      }
      .search {
        grid-area: search;
        display: flex;
        gap: 8px;
        align-items: center;
        min-width: 0;
      }
      .search input[type="search"] {
        flex: 1;
        min-width: 0;
        font-size: 14px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: none;
      }
      .search input[type="search"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent-weak);
      }
      .btn-methods {
        grid-area: badges;
        align-self: stretch;
        margin-left: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 140px;
        padding: 4px 4px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--hover);
        color: var(--text);
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
        text-align: center;
        text-decoration: none;
      }
      .btn-methods:hover {
        background: var(--chip);
        border-color: #d1d5db;
      }
      .btn-methods small {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
      }
      .stats {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.3;
        text-align: right;
        padding-right: 2px;
      }
      /* Narrow screens: put the list buttons below the search bar */
      @media (max-width: 720px) {
        header .inner {
          grid-template-columns: 1fr;
          grid-template-areas:
            "title"
            "search"
            "badges";
        }
        .btn-methods {
          margin-left: 0;
          padding: 8px 4px;
        }
      }
      /* Tree styling */
      .tree {
        margin-top: 16px;
      }
      details {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 10px;
        background: white;
      }
      details + details {
        margin-top: 8px;
      }
      details > summary {
        list-style: none;
        cursor: pointer;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      details > summary::-webkit-details-marker {
        display: none;
      }
      .caret {
        width: 0;
        height: 0;
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-left: 7px solid var(--muted);
        transition: transform 0.15s ease;
      }
      details[open] > summary .caret {
        transform: rotate(90deg);
      }
      summary .badge {
        background: var(--chip);
        border: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
        padding: 2px 6px;
        border-radius: 999px;
      }
      details > div {
        margin-top: 8px;
        padding-left: 14px;
      }
      /* Nested details indentation */
      details details {
        margin-top: 8px;
      }
      details details > summary {
        font-weight: 600;
      }
      /* Lists */
      ul {
        margin: 8px 0;
        padding-left: 18px;
      }
      li {
        margin: 4px 0;
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      /* Filtered (hidden) nodes */
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <section class="hero">
      <div class="hero-inner">
        <h1 class="hero-title">OpenCodePapers</h1>
        <p class="hero-sub">
          Collecting benchmark results and code links of research papers.
        </p>
        <p class="hero-sub">
          Contribute on
          <a
            href="https://gitlab.com/OpenCodePapers/OpenCodePapers"
            target="_blank"
            rel="noopener noreferrer"
            style="color: darkorange"
            >GitLab</a
          >
        </p>
      </div>
    </section>
    <header class="sticky">
      <div class="inner">
        <div class="header-top">
          <h1>Tasks</h1>
          <div class="controls">
            <button class="btn" id="expand-all">Expand all</button>
            <button class="btn" id="collapse-all">Collapse all</button>
          </div>
        </div>
        <div class="search">
          <input
            id="q"
            type="search"
            placeholder="Filter tasks… (e.g., 'pose estimation' or 'coco')"
          />
          <span class="stats" id="stats"></span>
        </div>
        <a
          class="btn-methods"
          href="papers/index.html"
          target="_blank"
          rel="noopener noreferrer"
        >
          Full Paper List<br /><small>click here to open</small>
        </a>
      </div>
    </header>

    <div class="wrap">
      <div id="tree" class="tree">
        <!--TREE-->
      </div>
    </div>

    <!--[search]-->

    <script>
      (function () {
        const tree = document.getElementById("tree");
        const stats = document.getElementById("stats");
        const inp = document.getElementById("q");
        const BTN_EXPAND_ALL = document.getElementById("expand-all");
        const BTN_COLLAPSE_ALL = document.getElementById("collapse-all");

        // Add carets + badges
        const summaries = tree.querySelectorAll("summary");
        summaries.forEach((sm) => {
          const caret = document.createElement("span");
          caret.className = "caret";
          sm.prepend(caret);
        });

        // Count descendant links for each <details> once
        function computeCounts() {
          tree.querySelectorAll("details").forEach((d) => {
            const n = d.querySelectorAll("a").length;
            const sm = d.querySelector(":scope > summary");
            if (!sm) return;
            const badge = document.createElement("span");
            badge.className = "badge";
            badge.textContent = n;
            sm.appendChild(badge);
          });
          updateStats();
        }

        function updateStats() {
          let visible = 0;
          tree.querySelectorAll("a").forEach((a) => {
            // visible if itself and all ancestors are not hidden
            let el = a;
            let ok = true;
            while (el && el !== tree) {
              if (el.classList && el.classList.contains("hidden")) {
                ok = false;
                break;
              }
              el = el.parentElement;
            }
            if (ok) visible++;
          });
          stats.innerHTML = visible + "<br>items";
        }

        // Expanders
        BTN_EXPAND_ALL.addEventListener("click", () => {
          tree.querySelectorAll("details").forEach((d) => (d.open = true));
        });
        BTN_COLLAPSE_ALL.addEventListener("click", () => {
          tree.querySelectorAll("details").forEach((d) => (d.open = false));
        });

        // Simple debounce
        let t = 0;
        inp.addEventListener("input", () => {
          clearTimeout(t);
          t = setTimeout(
            () => applyFilter(inp.value.trim().toLowerCase()),
            150,
          );
        });

        function clearHighlights() {
          tree.querySelectorAll("mark").forEach((m) => {
            const parent = m.parentNode;
            parent.replaceChild(document.createTextNode(m.textContent), m);
            parent.normalize();
          });
        }

        function applyFilter(q) {
          clearHighlights();
          // Fast path: empty query shows everything collapsed
          if (!q) {
            tree
              .querySelectorAll(".hidden")
              .forEach((el) => el.classList.remove("hidden"));
            BTN_COLLAPSE_ALL.click();
            updateStats();
            return;
          }
          // hide everything first
          tree
            .querySelectorAll("li, details")
            .forEach((el) => el.classList.add("hidden"));
          tree.querySelectorAll("details").forEach((d) => (d.open = false));

          // show matching links and open their ancestor details
          const links = tree.querySelectorAll("a");
          const qParts = queryParts(q);
          const re = partsRegex(qParts);
          links.forEach((a) => {
            const text = normalize(a.textContent);
            const ok = qParts.every((part) => text.includes(part));
            if (ok) {
              // highlight
              highlight(a, re);
              // unhide the <li>
              const li = a.closest("li");
              if (li) li.classList.remove("hidden");
              // open/unhide all ancestor <details> and their summaries
              let p = a.parentElement;
              while (p && p !== tree) {
                if (p.tagName === "DETAILS") {
                  p.classList.remove("hidden");
                  p.open = true;
                }
                if (p.tagName === "LI") p.classList.remove("hidden");
                p = p.parentElement;
              }
            }
          });
          // keep visible summaries' immediate <summary> also unhidden
          tree.querySelectorAll("details").forEach((d) => {
            if (!d.classList.contains("hidden") && d.open) {
              const sm = d.querySelector(":scope > summary");
              if (sm) sm.classList.remove("hidden");
            }
          });
          updateStats();
        }

        computeCounts();
        BTN_COLLAPSE_ALL.click();
      })();
    </script>
  </body>
</html>
