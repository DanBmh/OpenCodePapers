<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenCodePapers</title>
    <link rel="icon" href="../favicon.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--[basestyle]-->
    <!--[herostyle]-->
    <style>
      .wrap {
        max-width: 1100px;
        margin: 32px auto;
        padding: 0 16px;
      }
      h1 {
        font-size: 28px;
        margin: 0 0 8px;
      }
      .header-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        justify-content: space-between;
      }
      .dataset-link {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .dataset-link:hover {
        text-decoration: underline;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 4px;
      }
      .chip {
        background: #f3f4f6;
        border: 1px solid var(--border);
        color: #374151;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
      }
      .nocode {
        display: none;
      }
      .btn {
        border: 1px solid var(--border);
        background: white;
        color: var(--text);
        padding: 6px 10px;
        border-radius: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .btn:hover {
        background: #f9fafb;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 2px 10px rgba(17, 24, 39, 0.04);
      }
      .hero-title {
        font-size: 28px;
        margin: 0 0 6px;
      }
      /* Smaller variant for benchmark pages */
      .hero-small {
        padding: 20px 16px; /* less height than index */
        margin-bottom: 20px;
      }
      .section-title {
        margin: 4px 0 12px;
        font-size: 18px;
        color: #1f2937;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      thead th {
        position: sticky;
        top: 0;
        background: #f9fafb;
        text-align: left;
        font-weight: 600;
        padding: 10px;
        border-bottom: 1px solid var(--border);
        cursor: default;
      }
      thead th[data-sortable="true"] {
        cursor: pointer;
      }
      th[data-key="c"],
      td.code {
        min-width: 100px;
        white-space: nowrap;
        text-align: center;
      }
      tbody td {
        padding: 10px;
        border-bottom: 1px solid var(--border);
        vertical-align: top;
      }
      tbody tr:hover {
        background: #fbfdff;
      }
      .sort-indicator {
        opacity: 0.45;
        margin-left: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .legend-note {
        color: var(--muted);
        font-size: 12px;
        margin-top: 6px;
      }
      a {
        color: #1d4ed8;
      }
      .footer-note {
        color: var(--muted);
        margin-top: 12px;
        font-size: 13px;
      }
      .stack {
        display: grid;
        gap: 14px;
      }
      /* Plot container height */
      #metricPlot {
        width: 100%;
        height: 360px;
      }
    </style>
  </head>
  <body data-papers-base="../papers/">
    <section class="hero hero-small">
      <div class="hero-inner">
        <h1 class="hero-title">
          <a href="../index.html">OpenCodePapers</a>
        </h1>
      </div>
    </section>
    <div class="wrap stack">
      <div class="header-row">
        <div>
          <h1><!--[title]--></h1>
          <!--[subtitle]-->
        </div>
        <div><!--[datasetlink]--></div>
      </div>

      <div class="card">
        <span>Results over time</span>
        <div id="metricPlot"></div>
        <div class="legend-note">
          Click legend items to toggle metrics. Hover points for model names.
        </div>
      </div>

      <div class="card">
        <div
          class="section-title"
          style="
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
          "
        >
          <span>Leaderboard</span>
          <button class="btn toggle-nocode">Show papers without code</button>
        </div>
        <div class="footer-note">Click a sortable column header to sort.</div>
        <div style="overflow-x: auto">
          <table id="resultsTable">
            <thead>
              <tr>
                <!--[theadcells]-->
              </tr>
            </thead>
            <tbody>
              <!--[tbodycells]-->
            </tbody>
          </table>
        </div>
        <div class="footer-note" style="margin-top: 10px">
          <!--[caption]-->
        </div>
      </div>
    </div>

    <!--[modal]-->

    <!-- Plotly chart -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script>
      (function() {
        const tracesCode = [ <!--[traces_code]--> ];

        const layout = {
          paper_bgcolor: 'white',
          plot_bgcolor: 'white',
          font: { color: '#111827' },
          margin: { l: 50, r: 20, t: 10, b: 40 },
          xaxis: { type: 'date', gridcolor: '#e5e7eb', title: 'Date' },
          yaxis: { gridcolor: '#e5e7eb', title: 'Metric value', automargin: true },
          legend: { orientation: 'h', x: 0, y: 1.15 }
        };
        const cfg = { displayModeBar:false, responsive:true };

        // Hide all but the first metric initially
        tracesCode.forEach((trace, idx) => {
          if (idx > 0) {
            trace.visible = 'legendonly';
          }
        });

        // Create the plot
        Plotly.newPlot('metricPlot', tracesCode, layout, cfg);
      })();
    </script>

    <!-- No code visibility toggle -->
    <script>
      (function () {
        let showNoCode = false; // start hidden
        const btns = document.querySelectorAll(".toggle-nocode");

        function applyNoCodeVisibility() {
          // Table rows: force correct display for <tr>
          document.querySelectorAll("tr.nocode").forEach((tr) => {
            tr.style.display = showNoCode ? "table-row" : "none";
          });

          // Sync all buttons' labels
          btns.forEach((b) => {
            b.textContent = showNoCode
              ? "Hide papers without code"
              : "Show papers without code";
          });
        }

        btns.forEach((b) => {
          b.addEventListener("click", () => {
            showNoCode = !showNoCode;
            applyNoCodeVisibility();
          });
        });

        // Ensure initial state matches default (hidden)
        applyNoCodeVisibility();
      })();
    </script>

    <!-- Table sorting -->
    <script>
      (function () {
        const table = document.getElementById("resultsTable");
        let sortIdx = -1;
        let sortAsc = true;

        const getCellValue = (tr, idx, type) => {
          const td = tr.children[idx];
          if (!td) return "";
          if (type === "number" || type === "date") {
            const v = td.getAttribute("data-value");
            if (v === null || v === "") return NaN;
            return Number(v);
          }
          return (td.textContent || "").trim().toLowerCase();
        };

        const compare = (a, b, type, asc) => {
          const va = getCellValue(a, sortIdx, type);
          const vb = getCellValue(b, sortIdx, type);
          if (type === "string") {
            return (va > vb ? 1 : va < vb ? -1 : 0) * (asc ? 1 : -1);
          }
          if (isNaN(va) && isNaN(vb)) return 0;
          if (isNaN(va)) return 1;
          if (isNaN(vb)) return -1;
          return (va - vb) * (asc ? 1 : -1);
        };

        table.querySelectorAll("thead th").forEach((th, idx) => {
          if (th.getAttribute("data-sortable") !== "true") return;
          th.addEventListener("click", () => {
            const type = th.getAttribute("data-type") || "string";
            if (sortIdx === idx) {
              sortAsc = !sortAsc;
            } else {
              sortIdx = idx;
              sortAsc = type === "string"; // strings asc first, numbers/dates desc first
            }
            const tbody = table.tBodies[0];
            Array.from(tbody.querySelectorAll("tr"))
              .sort((a, b) => compare(a, b, type, sortAsc))
              .forEach((tr) => tbody.appendChild(tr));
          });
        });
      })();
    </script>
  </body>
</html>
